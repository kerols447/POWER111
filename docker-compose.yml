version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: power111-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-power111}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-power111_secret}
      POSTGRES_DB: ${DB_NAME:-power111}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-power111}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
